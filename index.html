<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172033">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Controle Casas">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Controle de Casas</title>
<style>
:root{
  --bg:#f5f7fb;--card:#ffffff;--text:#172033;--muted:#718096;
  --border:#e3e8f0;--primary:#2563eb;--danger:#dc2626;--success:#15803d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{background:#172033;color:white;padding:22px 18px}
header h1{margin:0 0 4px;font-size:1.6rem}
header p{margin:0;color:#cbd5e1;font-size:.92rem}
main{width:min(900px,calc(100% - 24px));margin:18px auto 40px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.summary div,.card,.person{background:var(--card);border:1px solid var(--border);border-radius:12px}
.summary div{padding:15px}
.summary span{display:block;color:var(--muted);font-size:.8rem;margin-bottom:5px}
.summary strong{font-size:1.25rem}
.card{padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:1.05rem}
.form-row{display:grid;grid-template-columns:1fr auto;gap:9px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;font-size:16px;color:var(--text);background:white}
input:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--primary)}
button{border:0;border-radius:9px;padding:11px 14px;font-weight:bold;cursor:pointer}
.primary{background:var(--primary);color:white}
.secondary{background:white;color:var(--text);border:1px solid var(--border)}
.danger{background:white;color:var(--danger);border:1px solid #fecaca}
.message{min-height:20px;margin-top:8px;font-size:.88rem;font-weight:bold}
.error{color:var(--danger)}.success{color:var(--success)}
.toolbar{display:flex;gap:9px;align-items:end}
.toolbar label{flex:1}
label{display:grid;gap:6px;color:var(--muted);font-size:.82rem;font-weight:bold}
.toolbar-actions{display:flex;gap:8px}
.person{margin-bottom:12px;overflow:hidden}
.person-header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px;cursor:pointer;user-select:none}
.person-header:hover{background:#f8fafc}
.person-header h3{margin:0;font-size:1.05rem}
.person-title{display:flex;align-items:center;gap:10px}
.arrow{font-size:.85rem;color:var(--muted);transition:transform .2s}
.person.open .arrow{transform:rotate(90deg)}
.person-content{display:none;border-top:1px solid var(--border)}
.person.open .person-content{display:block}
.person-total{text-align:right}
.person-total span{display:block;color:var(--muted);font-size:.75rem}
.person-actions{display:flex;gap:8px;flex-wrap:wrap;padding:10px 15px;border-bottom:1px solid var(--border)}
.person-actions button{padding:8px 10px;font-size:.82rem}
.house-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--border)}
.house-row:last-child{border-bottom:0}
.house-name{font-weight:bold}
.house-info{color:var(--muted);font-size:.8rem;margin-top:3px}
.house-value{font-weight:bold}
.house-buttons{display:flex;gap:6px}
.house-buttons button{padding:7px 9px;font-size:.78rem}
.empty{text-align:center;color:var(--muted);padding:28px}
dialog{width:min(480px,calc(100% - 20px));border:0;border-radius:12px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog form{padding:17px;display:grid;gap:12px}
.dialog-header{display:flex;justify-content:space-between;gap:10px;align-items:start}
.dialog-header h2{margin:0;font-size:1.1rem}
.dialog-header p{margin:4px 0 0;color:var(--muted);font-size:.82rem}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:0 15px 22px}
@media(max-width:650px){
  .summary{grid-template-columns:1fr 1fr}.summary div:last-child{grid-column:1/-1}
  .toolbar{flex-direction:column;align-items:stretch}.toolbar-actions{display:grid;grid-template-columns:1fr 1fr}
  .house-row{grid-template-columns:1fr auto}.house-buttons{grid-column:1/-1}.house-buttons button{flex:1}
}
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
    <div>
      <h1>Controle de Casas</h1>
      <p>Toque em um nome para ver as casas vinculadas.</p>
    </div>
    <button id="installBtn" class="secondary" type="button" style="display:none">Instalar app</button>
  </div>
</header>

<main>
<section class="summary">
  <div><span>Nomes cadastrados</span><strong id="countPeople">0</strong></div>
  <div><span>Casas cadastradas</span><strong id="countHouses">0</strong></div>
  <div><span>Saldo total</span><strong id="grandTotal">R$ 0,00</strong></div>
</section>

<section class="card">
  <h2>Adicionar nome</h2>
  <form id="personForm" class="form-row">
    <input id="personName" type="text" placeholder="Digite o nome">
    <button class="primary" type="submit">Adicionar</button>
  </form>
  <div id="personMessage" class="message"></div>
</section>

<section class="card toolbar">
  <label>Pesquisar
    <input id="search" type="search" placeholder="Nome ou casa">
  </label>
  <div class="toolbar-actions">
    <button id="exportBtn" class="secondary" type="button">Exportar</button>
    <button id="importBtn" class="secondary" type="button">Importar</button>
  </div>
  <input id="importFile" type="file" accept=".json" hidden>
</section>

<section id="list"></section>
</main>

<dialog id="houseDialog">
<form id="houseForm">
  <div class="dialog-header">
    <div>
      <h2 id="dialogTitle">Adicionar casa</h2>
      <p id="dialogPerson"></p>
    </div>
    <button id="closeDialog" class="secondary" type="button">X</button>
  </div>

  <input id="currentPersonId" type="hidden">
  <input id="currentHouseId" type="hidden">

  <label>Casa de apostas
    <input id="houseName" type="text" placeholder="Ex.: Betano">
  </label>

  <label>Identificação da conta
    <input id="houseLogin" type="text" placeholder="Opcional">
  </label>

  <label>Valor atual
    <input id="houseBalance" type="text" inputmode="decimal" placeholder="0,00">
  </label>

  <label>Observação
    <textarea id="houseNote" rows="3" placeholder="Opcional"></textarea>
  </label>

  <div id="houseMessage" class="message"></div>

  <div class="dialog-actions">
    <button id="cancelDialog" class="secondary" type="button">Cancelar</button>
    <button class="primary" type="submit">Salvar</button>
  </div>
</form>
</dialog>

<footer>Os dados ficam salvos neste navegador. Faça backups regularmente.</footer>

<script>
(function(){
"use strict";

var STORAGE_KEY="controleCasasPorNome_v1";
var people=[];
var $=function(id){return document.getElementById(id)};

function load(){
  try{
    var saved=localStorage.getItem(STORAGE_KEY);
    people=saved?JSON.parse(saved):[];
    if(!Array.isArray(people))people=[];
  }catch(e){people=[]}
}
function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(people));
  render();
}
function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}
function money(v){
  return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function parseMoney(v){
  var x=String(v||"").trim().replace(/[^\d,.-]/g,"");
  if(x.indexOf(",")>=0)x=x.replace(/\./g,"").replace(",",".");
  var n=Number(x);
  return isFinite(n)?n:NaN;
}
function esc(v){
  return String(v||"").replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
  });
}
function show(node,text,type){
  node.textContent=text;
  node.className="message "+type;
}
function clear(node){
  node.textContent="";
  node.className="message";
}
function sortPeople(){
  people.sort(function(a,b){return a.name.localeCompare(b.name,"pt-BR",{sensitivity:"base"});});
}
function sortHouses(person){
  person.houses.sort(function(a,b){return a.name.localeCompare(b.name,"pt-BR",{sensitivity:"base"});});
}

function render(){
  sortPeople();
  people.forEach(sortHouses);

  var query=$("search").value.trim().toLowerCase();
  var filtered=people.filter(function(person){
    var housesText=person.houses.map(function(h){return h.name+" "+h.login+" "+h.note;}).join(" ");
    return (person.name+" "+housesText).toLowerCase().indexOf(query)>=0;
  });

  var houseCount=0,total=0;
  people.forEach(function(person){
    houseCount+=person.houses.length;
    person.houses.forEach(function(h){total+=Number(h.balance||0);});
  });

  $("countPeople").textContent=people.length;
  $("countHouses").textContent=houseCount;
  $("grandTotal").textContent=money(total);

  if(!filtered.length){
    $("list").innerHTML='<section class="card empty">'+(people.length?"Nenhum resultado encontrado.":"Nenhum nome cadastrado.")+'</section>';
    return;
  }

  $("list").innerHTML=filtered.map(function(person){
    var subtotal=person.houses.reduce(function(sum,h){return sum+Number(h.balance||0);},0);
    var houses=person.houses.length?person.houses.map(function(h){
      return '<div class="house-row">'+
        '<div><div class="house-name">'+esc(h.name)+'</div>'+
        (h.login?'<div class="house-info">'+esc(h.login)+'</div>':'')+
        (h.note?'<div class="house-info">'+esc(h.note)+'</div>':'')+
        '</div>'+
        '<div class="house-value">'+money(h.balance)+'</div>'+
        '<div class="house-buttons">'+
          '<button class="secondary" onclick="editHouse(\''+person.id+'\',\''+h.id+'\')">Editar</button>'+
          '<button class="danger" onclick="deleteHouse(\''+person.id+'\',\''+h.id+'\')">Excluir</button>'+
        '</div>'+
      '</div>';
    }).join(""):'<div class="empty">Nenhuma casa cadastrada.</div>';

    return '<section class="person" id="person-'+person.id+'">'+
      '<div class="person-header" onclick="togglePerson(\''+person.id+'\')">'+
        '<div class="person-title"><span class="arrow">▶</span><h3>'+esc(person.name)+'</h3></div>'+
        '<div class="person-total"><span>Saldo total</span><strong>'+money(subtotal)+'</strong></div>'+
      '</div>'+
      '<div class="person-content">'+
        '<div class="person-actions">'+
          '<button class="primary" onclick="event.stopPropagation();addHouse(\''+person.id+'\')">+ Adicionar casa</button>'+
          '<button class="secondary" onclick="event.stopPropagation();editPerson(\''+person.id+'\')">Editar nome</button>'+
          '<button class="danger" onclick="event.stopPropagation();deletePerson(\''+person.id+'\')">Excluir nome</button>'+
        '</div>'+
        houses+
      '</div>'+
    '</section>';
  }).join("");
}

$("personForm").addEventListener("submit",function(e){
  e.preventDefault();
  clear($("personMessage"));
  var name=$("personName").value.trim();

  if(!name){
    show($("personMessage"),"Digite um nome.","error");
    return;
  }
  if(people.some(function(p){return p.name.toLowerCase()===name.toLowerCase();})){
    show($("personMessage"),"Este nome já está cadastrado.","error");
    return;
  }

  people.push({id:uid(),name:name,houses:[]});
  save();
  $("personForm").reset();
  show($("personMessage"),"Nome cadastrado com sucesso.","success");
});

$("search").addEventListener("input",render);

window.togglePerson=function(personId){
  var selected=document.getElementById("person-"+personId);
  if(!selected)return;
  var wasOpen=selected.classList.contains("open");
  document.querySelectorAll(".person.open").forEach(function(card){
    card.classList.remove("open");
  });
  if(!wasOpen)selected.classList.add("open");
};

window.addHouse=function(personId){
  var person=people.find(function(p){return p.id===personId;});
  if(!person)return;

  $("houseForm").reset();
  clear($("houseMessage"));
  $("currentPersonId").value=personId;
  $("currentHouseId").value="";
  $("dialogTitle").textContent="Adicionar casa";
  $("dialogPerson").textContent=person.name;
  $("houseDialog").showModal();
};

window.editHouse=function(personId,houseId){
  var person=people.find(function(p){return p.id===personId;});
  var house=person&&person.houses.find(function(h){return h.id===houseId;});
  if(!house)return;

  clear($("houseMessage"));
  $("currentPersonId").value=personId;
  $("currentHouseId").value=houseId;
  $("houseName").value=house.name;
  $("houseLogin").value=house.login||"";
  $("houseBalance").value=Number(house.balance).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  $("houseNote").value=house.note||"";
  $("dialogTitle").textContent="Editar casa";
  $("dialogPerson").textContent=person.name;
  $("houseDialog").showModal();
};

$("houseForm").addEventListener("submit",function(e){
  e.preventDefault();
  clear($("houseMessage"));

  var person=people.find(function(p){return p.id===$("currentPersonId").value;});
  var name=$("houseName").value.trim();
  var balance=parseMoney($("houseBalance").value);

  if(!name){
    show($("houseMessage"),"Digite o nome da casa.","error");
    return;
  }
  if(isNaN(balance)){
    show($("houseMessage"),"Digite um valor válido.","error");
    return;
  }

  var data={
    name:name,
    login:$("houseLogin").value.trim(),
    balance:balance,
    note:$("houseNote").value.trim()
  };

  var houseId=$("currentHouseId").value;
  if(houseId){
    var index=person.houses.findIndex(function(h){return h.id===houseId;});
    person.houses[index]=Object.assign(person.houses[index],data);
  }else{
    data.id=uid();
    person.houses.push(data);
  }

  sortHouses(person);
  save();
  $("houseDialog").close();
});

window.deleteHouse=function(personId,houseId){
  var person=people.find(function(p){return p.id===personId;});
  if(confirm("Excluir esta casa?")){
    person.houses=person.houses.filter(function(h){return h.id!==houseId;});
    save();
  }
};

window.editPerson=function(personId){
  var person=people.find(function(p){return p.id===personId;});
  var newName=prompt("Novo nome:",person.name);
  if(newName===null)return;
  newName=newName.trim();

  if(!newName){
    alert("Digite um nome válido.");
    return;
  }
  if(people.some(function(p){return p.id!==personId&&p.name.toLowerCase()===newName.toLowerCase();})){
    alert("Este nome já está cadastrado.");
    return;
  }

  person.name=newName;
  save();
};

window.deletePerson=function(personId){
  var person=people.find(function(p){return p.id===personId;});
  if(confirm("Excluir "+person.name+" e todas as casas vinculadas?")){
    people=people.filter(function(p){return p.id!==personId;});
    save();
  }
};

$("closeDialog").onclick=function(){$("houseDialog").close();};
$("cancelDialog").onclick=function(){$("houseDialog").close();};

$("exportBtn").onclick=function(){
  var blob=new Blob([JSON.stringify({data:people},null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download="backup-controle-casas.json";
  a.click();
  URL.revokeObjectURL(url);
};

$("importBtn").onclick=function(){$("importFile").click();};
$("importFile").addEventListener("change",function(){
  var file=this.files[0];
  if(!file)return;

  var reader=new FileReader();
  reader.onload=function(){
    try{
      var parsed=JSON.parse(reader.result);
      var imported=Array.isArray(parsed)?parsed:parsed.data;
      if(!Array.isArray(imported))throw new Error();

      people=imported.map(function(p){
        return {
          id:p.id||uid(),
          name:p.name||"Sem nome",
          houses:Array.isArray(p.houses)?p.houses:[]
        };
      });
      save();
      alert("Backup importado com sucesso.");
    }catch(e){
      alert("Arquivo de backup inválido.");
    }
  };
  reader.readAsText(file);
});

var deferredPrompt=null;
var installBtn=$("installBtn");

window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();
  deferredPrompt=e;
  installBtn.style.display="inline-block";
});

installBtn.addEventListener("click",async function(){
  if(!deferredPrompt){
    alert("Abra o menu do navegador e toque em 'Adicionar à tela inicial' ou 'Instalar aplicativo'.");
    return;
  }
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  installBtn.style.display="none";
});

window.addEventListener("appinstalled",function(){
  installBtn.style.display="none";
});

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("service-worker.js").catch(function(){});
  });
}

load();
render();
})();
</script>
</body>
</html>
